# ===========================================================================
#  starpos.cfg  -  starpOS master system configuration
# ===========================================================================
#  Every setting lives here so no .bat file has to hard-code it.
#
#  Load the whole file into environment variables from any batch script:
#
#     for /f "usebackq eol=# tokens=1,2 delims==" %%A in ("starpos.cfg") do (
#         set "%%A=%%B"
#     )
#
#  Read ONE value only (example: the version):
#
#     for /f "usebackq eol=# tokens=2 delims==" %%A in (`findstr "^OS_VERSION=" starpos.cfg`) do (
#         set "OS_VERSION=%%A"
#     )
#
#  RULES: one KEY=VALUE per line, no spaces around the "=", no quotes.
#         Lines starting with # are comments and are skipped by eol=#.
# ===========================================================================

# --- Identity ---------------------------------------------------------------
OS_NAME=starpOS
OS_VERSION=1.5.0
OS_CODENAME=Northstar
OS_BUILD=2026.08.21
OS_ARCH=Batch 64-bit Emulation
OS_DEVELOPER=ScottSoft Team
OS_CHANNEL=stable

# --- Paths (relative to the system folder) ----------------------------------
DIR_ROOT=..
DIR_DATA=..\data
DIR_DEBUG=..\debug
DIR_BUILDS=..\builds
DIR_RESOURCES=..\resources
DIR_SYSTEM=.

# --- Log stream targets -----------------------------------------------------
LOG_KERNEL=..\data\1.log
LOG_SYSTEM=..\data\2.log
LOG_USER=..\data\3.log
LOG_LEVEL=INFO

# --- Boot behaviour ---------------------------------------------------------
BOOT_SPLASH=1
BOOT_DELAY=1
BOOT_VOICE=1
BOOT_AUTOSCAN=1
BOOT_TARGET=startup.bat

# --- Theme ------------------------------------------------------------------
# Colour codes are standard CMD "color" pairs: background then foreground.
THEME_NAME=Classic Blue
THEME_DESKTOP=0A
THEME_BOOT=0B
THEME_LOGIN=0E
THEME_ERROR=0C
THEME_SHUTDOWN=0C

# --- Voice engine -----------------------------------------------------------
VOICE_ENABLED=1
VOICE_ENGINE=SAPI
VOICE_SCRIPT=speak.vbs
VOICE_RATE=0
VOICE_VOLUME=100

# --- Accounts ---------------------------------------------------------------
USER_DB=users.db
DEFAULT_USER=Admin
ALLOW_GUEST=1
MAX_LOGIN_TRIES=3

# --- Developer mode ---------------------------------------------------------
# DEV_MODE=1 unlocks the developer tools, the raw command console, and every
# menu.cfg line flagged "dev". Unlocking from the desktop only lasts for that
# session unless you pick "remember" inside the developer menu.
#
# DEV_PASS is not security. It is a speed bump so the repair and log editing
# tools are not one keypress away from a normal session. Anyone who can open
# this file can read it.
DEV_MODE=0
DEV_PASS=starp
DEV_CONFIRM_DESTRUCTIVE=1

# --- Applications -----------------------------------------------------------
APP_REGISTRY=apps.reg
APP_AI=ai.bat
APP_VOICE=Voice.bat
APP_MOVIES=movies.bat
APP_USB=usb.bat
