# =========================================================================
#  minds.cfg  -  the models starpOS may ask
# =========================================================================
#  FORMAT:  name|kind|endpoint|model|enabled|key
#
#    kind ollama   a local Ollama. No key, nothing leaves the machine.
#    kind openai   anything with an OpenAI shaped API at
#                  /v1/chat/completions - LM Studio, Jan, llama.cpp
#                  server, or a hosted one if you put a key in.
#
#    enabled  1 or 0. A 0 mind is never contacted at all.
#    key      left empty for local models, which need none.
#
#  WHY MORE THAN ONE
#  Two models given the same question rarely answer the same way. The
#  council command asks every enabled mind at once and shows the answers
#  side by side, so the disagreement is visible instead of hidden.
#
#  ADDING A SECOND LOCAL MODEL - free, offline, one command:
#      ollama pull qwen2.5:3b
#  then set enabled to 1 on the second line below.
#
#  NOTHING IS SENT ANYWHERE unless a mind is enabled AND its endpoint is
#  not local. The two below are both on this machine.
# =========================================================================

ollama|ollama|http://127.0.0.1:11434|llama3.2:3b|1|
second|ollama|http://127.0.0.1:11434|qwen2.5:3b|0|
studio|openai|http://127.0.0.1:1234|local-model|0|
