D|Developer Mode|builtin|devmode
X|Shut Down|builtin|shutdown

# --- Developer mode only. These stay hidden until dev mode is unlocked. ----
C|Dev Console|builtin|devconsole|dev
S|System Scan|builtin|devscan|dev
R|Repair Errors|builtin|devrepair|dev
L|Edit Logs|builtin|devlogs|dev
N|New App|builtin|devnew|dev
I|Install App|builtin|devinstall|dev

