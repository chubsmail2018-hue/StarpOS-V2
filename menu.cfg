# ===========================================================================
#  menu.cfg  -  the starpOS desktop menu
# ===========================================================================
#  startup.bat draws its menu from this file and dispatches from it too, so
#  you can add an app to the desktop WITHOUT writing any batch code. Add a
#  line here, save, reboot. That is the whole job.
#
#  FORMAT:  slot|label|type|target|flags
#
#    slot    what the user types. Numbers or letters, must be unique.
#    label   the text shown on the desktop.
#    type    builtin - jump to a routine already inside startup.bat
#            bat     - call another batch file
#            ps1     - run a PowerShell script
#            vbs     - run a VBScript
#            cmd     - run a raw command line
#            show    - print a text file and pause
#    target  the routine name, file name, or command to run.
#    flags   optional. "dev" means the line only appears on the desktop
#            while developer mode is unlocked. Leave it off for a normal
#            app. Older four-field lines still work exactly as before.
#
#  Lines starting with # are ignored, so you can comment an app out to hide
#  it from the desktop instead of deleting the line.
#
#  BUILTIN routines that exist inside startup.bat right now:
#    explorer  notepad  notes  sysinfo  realinfo  logs  tasks  search
#    calc      clock    cmdprompt  settings  voicectl  help  about  shutdown
#    devmode   devconsole  devscan  devrepair  devlogs  devnew  devinstall
# ===========================================================================

1|File Explorer|builtin|explorer
