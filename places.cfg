# ===========================================================================
#  places.cfg  -  starpOS CALL SIGNS
# ===========================================================================
#  Ported from Kohaku's autoloads/kohaku_places.gd. This is how you tell the
#  assistant WHAT to open, in two letters, without leaving the keyboard.
#
#  THE GRAMMAR
#
#      <THING><n?>  <WHERE?>
#
#  THING is two letters. n is which one, when there is more than one.
#  WHERE is M for main, or M1..M9 for a numbered screen.
#
#      PR          projects, wherever I am looking
#      PR1         project one
#      LC1         today's first log entry
#      NT M        a note, on the main screen
#
#  Plain English works everywhere the codes do. "bring my quests to main",
#  "pull up the want list" and "show me the meters" all land in the same
#  place, because the words column below is matched too.
#
#  FORMAT:  code|kind|numbered|words|about
#
#     code      two letters, always upper case
#     kind      what ai.bat opens. node: list panel, sys: live readout,
#               tool: does something, learn: knowledge panel
#     numbered  1 if a trailing digit picks one item, 0 if not
#     words     what a person actually says, comma separated.
#               The FIRST word is the one she says back.
#     about     one line, printed on the board and by the codes command
#
#  TWO RULES CAME ACROSS WITH THE TABLE. BOTH ARE LOAD-BEARING.
#
#  1. A code must not be an English word. Any bare two letter word in a
#     sentence is read as a code, so "AT" would fire on "put it AT the top"
#     and "IN" on almost everything. Hence AV, IV, KI, AL - none are words,
#     all still read as the thing they open.
#
#  2. A words entry is matched as a SUBSTRING, not on word boundaries, so a
#     short entry captures its own container. "art" matches "start", "course"
#     matches "of course", "earn" matches "learn". Write the longer, less
#     ambiguous phrasing - it is what a person says out loud anyway.
#
#  Adding one: append a line here. Nothing in ai.bat needs editing, the board
#  and the codes card both read this file.
# ===========================================================================

# --- work -------------------------------------------------------------------
PR|node|1|projects,project,the projects|Your projects. PR1, PR2... pick one.
NT|node|1|note,notepad,scratchpad,a note|A note you can write on.
QS|node|1|quests,quest,my checklist,the checklist|Quests. Every line can be started in ten seconds.
LC|node|1|log,the log,todays log,day log|Today's log. LC1 is the first entry.
WN|node|1|daily wins,wins,the challenge|Daily wins. What went right today.
WL|node|1|want list,things i want,wish list|The want list. Seen, wanted, not bought.
KI|node|1|my ideas,the pile,what have you noticed|Ideas. What you noticed and saved for later.
AR|node|1|archive,the archive,things put away|The archive. Finished and filed.

# --- life -------------------------------------------------------------------
LF|sys|0|life,life hub,how am i doing|Life. Today, focus, schedule, money, body.
FO|tool|0|focus,i cannot start,i am stuck,help me focus|Focus. One technique for how today is going wrong.
IV|node|1|inventory,the house,what do we have,our stuff|Inventory. What is in the house and if any is left.
PC|node|1|profile,profile card,who is|A profile card for someone you keep track of.

# --- learning ---------------------------------------------------------------
DC|learn|1|dictionary,definition,what does the word|Dictionary. What a word means, in your own words.
TT|learn|1|tech tips,tech tip,what is this error|Tech tips. An error or a term, in plain terms.
TR|learn|1|training,courses,lessons|Training. Courses you are working through.
DJ|learn|1|dojo,drills,flash cards|Training dojos. Short drills on terminology.
TY|tool|0|typing,typing practice,type test|Typing practice, on the things you actually type.
TH|tool|0|train her,teach her,what do you want to know|Train her. What she was told, and what she wants.
GU|learn|1|guides,the guides,how does she work|Guides. Her voice, her thinking, and how to watch.
AC|tool|0|arcade,fun fact,a fact,another word for|Arcade. A fact, a word, a better word, a roll.

# --- the machine ------------------------------------------------------------
KH|sys|0|status,her status,your status,how are you|Her. What she can reach and what she is doing.
DV|sys|0|device,performance,this machine|Device. How this machine is doing right now.
MX|sys|0|meters,the gauges,the rack,readings|Meters. A rack of live readings as bars.
NV|sys|0|nerves,the nerves,pathways,what is she made of|Nerves. One faculty at a time, and what is broken.
FB|tool|1|files,file browser,browse files|Files. Every folder starpOS can reach.
AL|node|1|assets,the asset list,what needs art|Assets. What is drawn in code, blank or approximate.
SE|tool|0|settings,admin,preferences,display settings|Settings. Theme, voice, and what she remembers.
LG|sys|0|streams,the log streams,kernel log|The log streams. Kernel, system and user.
DR|sys|0|drives,disks,hard drive,disc drive,what is plugged in|Drives. Every disk attached, and how full each one is.
MD|sys|0|doctor,health check,checkup,is anything broken|The doctor. One pass over every tool and service.
LM|sys|1|minds,models,the llm,ollama|Minds. The models she can ask, and whether they answer.
AU|sys|1|automations,rules,on her own,by herself|Automations. When she is allowed to act without being asked.

# --- media and making -------------------------------------------------------
VD|tool|0|video feed,video,videos,the movies|The video feed. Every film starpOS can see.
GY|tool|0|gallery,the carousel,my pictures|Gallery. Every picture on a ring you can spin.
MV|tool|0|model viewer,the model,turntable,wireframe|Model. One thing on a turntable.
SK|tool|1|sketch,scribble,let me draw|Sketch. Something to draw on, in text.
CR|tool|1|create,make me,build me,write me a tool|Create. She writes a brief. Nothing is ever run.
GL|tool|1|globe,the world,send the globe|The globe. Spin it, or send it: globe to tokyo.
WB|tool|0|web browser,the web,internet|The web browser. Opens outside starpOS.
