# =========================================================================
#  rules.cfg  -  when she is allowed to act on her own
# =========================================================================
#  FORMAT:  enabled|when|threshold|then|note
#
#  WHEN one of:
#     unanswered_over   more than N questions she could not answer
#     quests_over       more than N quests still open
#     disk_below_gb     less than N GB free on the starpOS drive
#     memory_over       more than N percent of memory in use
#     mind_offline      any enabled model has stopped answering
#
#  THEN one of:
#     tell_me           say it in the bar, next time you look
#     ask_a_mind        ask a model about it and show the answer
#     write_a_note      put it on the NT list so it is not lost
#     flag_it           write it to the flag stream and nothing else
#
#  Every rule is listed on the AU panel with what it last did. An
#  automation you cannot see is one you cannot trust, so none of these
#  ever act silently.
# =========================================================================

1|unanswered_over|5|tell_me|Nudge me when the teaching pile builds up
1|disk_below_gb|5|tell_me|Warn me before the drive fills
1|memory_over|90|tell_me|Warn me when the machine is struggling
1|mind_offline|0|tell_me|Say so when a model stops answering
0|quests_over|10|write_a_note|Note it when the checklist gets long
